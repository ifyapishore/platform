<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     width="24" height="24"
     fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- Oops dot (separate, configurable) -->
  <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />

  <!-- Bottom-left arrow -->
  <polyline points="16 21 21 21 21 16" />

  <!-- Diagonal line from center to bottom-right -->
  <line x1="15" y1="15" x2="21" y2="21" />

  <!-- Top-left arrow -->
  <polyline points="21 8 21 3 16 3" stroke-width="1"/>
</svg>
